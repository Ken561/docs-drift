name: Docs Drift

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for docs drift
        uses: ./
        with:
          config: .docsdrift.yml
          fail-on-drift: "false"
          comment: "true"
